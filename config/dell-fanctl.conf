# dell-fanctl configuration
# Copy to /usr/local/etc/dell-fanctl.conf and edit as needed.
# Any values set here override the defaults baked into dell-fanctld.

# Temperature thresholds (°C)
# TEMP_LOW=20   # fan turns on above this
# TEMP_HIGH=55  # fan runs at max above this (at most 85)

# How far temp must drop before stepping down
# HYST_OFFSET=10

# How often to check temperature (seconds, 1 to 10)
# POLL_INTERVAL=5
