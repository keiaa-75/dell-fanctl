# dell-fanctl configuration
# Copy to /usr/local/etc/dell-fanctl.conf and edit as needed.
# Any values set here override the defaults baked into fan-control.sh.

# Temperature thresholds (°C)
# TEMP_LOW=20   # fan turns on above this
# TEMP_HIGH=55  # fan runs at max above this

# How far temp must drop before stepping down
# HYST_OFFSET=10

# How often to check temperature (seconds)
# POLL_INTEREVAL=5
